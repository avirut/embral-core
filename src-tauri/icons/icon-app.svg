<!-- The installable app icon: the embral mark on a filled dark tile, so it
     survives light surfaces (installer, taskbar, Add/Remove Programs) where
     the bare white mark (icon.svg, used by the tray) disappears.
     `pnpm tauri icon src-tauri/icons/icon-app.svg` regenerates the set. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#18181b" />
  <g transform="translate(50 50) scale(0.82) translate(-50 -50)">
    <circle cx="50" cy="50" r="40" stroke="white" stroke-width="7" fill="none" />
    <line x1="31" y1="69" x2="69" y2="31" stroke="white" stroke-width="7" stroke-linecap="round" />
    <line x1="23" y1="49" x2="49" y2="23" stroke="white" stroke-width="7" stroke-linecap="round" />
    <line x1="51" y1="77" x2="77" y2="51" stroke="white" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
