[package]
name = "embral-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
embral-types = { path = "../embral-types" }
embral-db = { path = "../embral-db" }
embral-notes = { path = "../embral-notes" }
embral-search = { path = "../embral-search" }
embral-embedder = { path = "../embral-embedder" }
rmcp = { version = "2.2", features = ["transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
