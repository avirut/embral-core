[package]
name = "embral-engine"
version = "0.1.0"
edition = "2021"
description = "Local speech engine for Embral: sherpa-onnx streaming ASR, punctuation, model registry, managed downloads."

[dependencies]
sherpa-onnx = "1.13"
serde = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
bzip2 = "0.6"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
rubato = "0.15"

[dev-dependencies]
hound = "3.5"
tempfile = "3"
