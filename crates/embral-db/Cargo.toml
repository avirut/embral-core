[package]
name = "embral-db"
version = "0.1.0"
edition = "2021"
description = "SQLite storage layer for Embral: meetings, transcript segments, and FTS5 search."

[dependencies]
embral-types = { path = "../embral-types" }
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1.9"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
