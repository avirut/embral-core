[package]
name = "embral-notes"
version = "0.1.0"
edition = "2021"
description = "Provider-agnostic meeting-note generation (OpenAI / Anthropic / Ollama) and post-meeting integrations for Embral."

[dependencies]
embral-types = { path = "../embral-types" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
